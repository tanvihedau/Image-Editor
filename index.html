<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Editor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="left">
          <div class="top">
            <label for="image-input" class="btn">
              CHoose image
              <input type="file" id="image-input" accept="image/*" hidden />
            </label>
            <button class="btn">rESET</button>
            <button class="btn">Download</button>
          </div>
          <div class="bottom">
            <div class="placeholder">
              <i class="ri-image-2-line"></i>
              <p>Choose an image to start editing</p>
            </div>
          </div>
        </div>
        <div class="right">
          <h2>Filters</h2>
          <div class="filters">     
            <div class="filter">
              <p>Brightness</p>
              <input
                type="range"
                min="0"
                max="200"
                name="brightness"
                value="100"
              />
            </div>
            <div class="filter">
              <p>Brightness</p>
              <input
                type="range"
                min="0"
                max="200"
                name="brightness"
                value="100"
              />
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
